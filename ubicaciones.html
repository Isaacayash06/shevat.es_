<!doctype html>
<html lang="es">
<head>
<meta name="robots" content="noindex,nofollow">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Dónde construimos · Shevat</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jost:wght@200;300;400;500&family=DM+Sans:opsz,wght@9..40,300;9..40,400;9..40,500&display=swap">
<link rel="stylesheet" href="vendor/maplibre-gl.css">
<style>
:root{--brand:#015e70;--ink:#023a45;--deep:#01262e;--sand:#efe9e1;--paper:#f6f3ee;--line:rgba(2,58,69,.14);--ease:cubic-bezier(.22,1,.36,1)}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--paper);color:var(--ink);font-family:"DM Sans",system-ui,sans-serif;-webkit-font-smoothing:antialiased;overflow:hidden}
#map{position:fixed;inset:0}
.maplibregl-ctrl-attrib{font-size:10px;background:rgba(246,243,238,.7)!important}
.maplibregl-ctrl-bottom-right{bottom:72px}

/* barra superior */
.top{position:fixed;z-index:20;top:0;left:0;right:0;display:flex;align-items:center;justify-content:space-between;padding:22px 32px;pointer-events:none}
.top>*{pointer-events:auto}
.wm{font:500 20px/1 "Jost",sans-serif;letter-spacing:.14em;color:var(--brand);text-decoration:none}
.top .back{font-size:11px;letter-spacing:.2em;text-transform:uppercase;color:var(--ink);text-decoration:none;opacity:.75}

/* entrada: vista aérea en gris, con grano y título grande */
#map canvas{transition:filter 2.4s var(--ease)}
body.intro-on #map canvas{filter:grayscale(1) contrast(1.18) brightness(.8)}
.intro{position:fixed;inset:0;z-index:30;display:grid;place-items:center;text-align:center;pointer-events:none;color:#fff;overflow:hidden;
  background:radial-gradient(90% 70% at 50% 50%,rgba(70,70,68,.22),rgba(52,52,50,.5));transition:opacity 1.9s var(--ease)}
.intro::before{content:"";position:absolute;inset:-60px;opacity:.32;mix-blend-mode:overlay;animation:grain 1s steps(5) infinite;
  background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='180' height='180'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.85' numOctaves='2' stitchTiles='stitch'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>")}
/* grano: transformaciones con GPU */
.intro::before{will-change:transform}
@keyframes grain{20%{transform:translate(-18px,12px)}40%{transform:translate(14px,-20px)}60%{transform:translate(-10px,-8px)}80%{transform:translate(20px,16px)}}
.intro .in{position:relative;transition:transform 2s var(--ease),opacity 1.3s var(--ease),filter 1.6s var(--ease)}
.intro .in>*{opacity:0;transform:translateY(24px);animation:rise 1.6s var(--ease) forwards}
.intro .in>:nth-child(2){animation-delay:.25s}.intro .in>:nth-child(3){animation-delay:.6s}
@keyframes rise{to{opacity:1;transform:none}}
.intro p{margin:0 0 30px;font:500 11px/1 "DM Sans",sans-serif;letter-spacing:.44em;text-transform:uppercase}
.intro h1{margin:0;font:200 clamp(52px,10.5vw,196px)/.86 "Jost",sans-serif;letter-spacing:.07em;text-transform:uppercase;padding-left:.07em;text-shadow:0 2px 40px rgba(0,0,0,.12)}
.intro .sub{margin-top:34px;font:300 15px/1.5 "Jost",sans-serif;letter-spacing:.12em;opacity:.9}
.intro .scroll{position:absolute;left:32px;bottom:30px;display:flex;align-items:center;gap:16px;font:500 11px/1 "DM Sans",sans-serif;letter-spacing:.3em;text-transform:uppercase}
.intro .scroll i{width:42px;height:42px;border:1px solid rgba(255,255,255,.8);border-radius:50%;display:grid;place-items:center}
.intro .scroll svg{width:15px;height:15px;fill:none;stroke:#fff;stroke-width:1.3;animation:bob 2.2s ease-in-out infinite}
.intro .scroll b{font-weight:500;opacity:.55}
@keyframes bob{50%{transform:translateY(4px)}}
.intro.gone{opacity:0}
.intro.gone .in{transform:scale(1.12);filter:blur(10px);opacity:0}
.nav,.mk,.maplibregl-ctrl-bottom-right,.top .wm,.top .back{transition:opacity .9s var(--ease),color 1.2s}
body.intro-on .mk,body.intro-on .lm,body.intro-on .zl,body.intro-on .nav,body.intro-on .maplibregl-ctrl-bottom-right{opacity:0!important;pointer-events:none}
body.intro-on .top .wm,body.intro-on .top .back{color:#fff}
@media (max-width:720px){.intro .scroll{left:20px;bottom:24px}.intro p{letter-spacing:.3em;font-size:10px}.intro .sub{font-size:13px;max-width:260px;margin-left:auto;margin-right:auto}}

/* marcadores */
.mk{display:grid;justify-items:center;gap:8px;cursor:pointer}
.mk .lb{font:500 10.5px/1 "DM Sans",sans-serif;letter-spacing:.2em;text-transform:uppercase;color:var(--deep);white-space:nowrap;
  text-shadow:0 0 6px var(--paper),0 0 2px var(--paper);transition:opacity .4s}
.mk .bub{position:relative;width:34px;height:34px;border-radius:50%;background:#fff;border:1px solid rgba(2,58,69,.25);display:grid;place-items:center;overflow:hidden;
  box-shadow:0 10px 24px -10px rgba(1,38,46,.55);transition:width .5s var(--ease),height .5s var(--ease),border-color .4s,background .4s}
.mk .bub img{width:100%;height:100%;object-fit:cover;opacity:0;transition:opacity .4s}
.mk .bub::after{content:"";position:absolute;left:50%;top:50%;margin:-5px 0 0 -5px;width:10px;height:10px;border-radius:50%;background:var(--brand);transition:opacity .3s}
.mk:hover .bub,.mk.on .bub{width:74px;height:74px;border-color:#fff;border-width:3px}
.mk:hover .bub img,.mk.on .bub img{opacity:1}
.mk:hover .bub::after,.mk.on .bub::after{opacity:0}
.mk .stem{width:1px;height:26px;background:linear-gradient(var(--deep),transparent)}
.mk.done .bub::after{background:#9aa7a9}
.lm{font:400 10px/1 "DM Sans",sans-serif;letter-spacing:.18em;text-transform:uppercase;color:rgba(2,58,69,.6);white-space:nowrap;display:flex;align-items:center;gap:6px}
.lm::before{content:"";width:4px;height:4px;border-radius:50%;background:currentColor}
.zl{font:200 13px/1 "Jost",sans-serif;letter-spacing:.42em;text-transform:uppercase;color:rgba(2,58,69,.55);white-space:nowrap}

/* tarjeta de promoción */
.card{position:fixed;z-index:25;left:32px;bottom:96px;width:min(380px,calc(100vw - 64px));background:rgba(255,255,255,.97);
  box-shadow:0 30px 60px -30px rgba(1,38,46,.45);transform:translateY(24px);opacity:0;pointer-events:none;transition:transform .7s var(--ease),opacity .5s}
.card.on{transform:none;opacity:1;pointer-events:auto}
.card .ph{position:relative;aspect-ratio:16/10;overflow:hidden;background:var(--sand)}
.card .ph img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:0;transform:scale(1.12);transition:opacity 1.1s var(--ease),transform 6s linear}
.card .ph img.on{opacity:1;transform:scale(1)}
.card .dots{position:absolute;left:14px;right:14px;bottom:12px;z-index:2;display:flex;gap:5px}
.card .dots i{flex:1;height:2px;background:rgba(255,255,255,.4);overflow:hidden;cursor:pointer}
.card .dots i b{display:block;height:100%;width:0;background:#fff}
.card .dots i.done b{width:100%}
.card .dots i.on b{animation:fillbar var(--dur,4s) linear forwards}
@keyframes fillbar{to{width:100%}}
.card .ph .nv{position:absolute;top:0;bottom:0;width:38%;z-index:2;cursor:pointer;background:none;border:0}
.card .ph .nv.l{left:0}.card .ph .nv.r{right:0}
.card .ph::after{content:"";position:absolute;left:0;right:0;bottom:0;height:34%;background:linear-gradient(0deg,rgba(1,30,36,.45),transparent);pointer-events:none;z-index:1}
.card .st,.card .ix{z-index:3}
.card.on .ph img{transform:none}
.card .st{position:absolute;left:14px;top:14px;padding:7px 11px;background:#fff;color:var(--brand);font:600 10.5px/1 "DM Sans",sans-serif;letter-spacing:.16em;text-transform:uppercase}
.card .bd{padding:20px 22px 22px;display:grid;gap:10px}
.card .zn{font-size:10.5px;letter-spacing:.22em;text-transform:uppercase;opacity:.65}
.card h3{margin:0;font:300 30px/1 "Jost",sans-serif;letter-spacing:-.02em;color:var(--brand)}
.card .mt{margin:0;font-size:14px;line-height:1.55;opacity:.85}
.card .nr{display:flex;flex-wrap:wrap;gap:6px 14px;margin:2px 0 4px;padding:12px 0 0;border-top:1px solid var(--line);font-size:12.5px;opacity:.85}
.card .nr span::before{content:"↳ ";opacity:.5}
.card .go{display:inline-flex;align-items:center;justify-content:center;gap:10px;margin-top:6px;min-height:46px;background:var(--brand);color:#fff;text-decoration:none;
  font:500 11px/1 "DM Sans",sans-serif;letter-spacing:.2em;text-transform:uppercase;border-radius:999px}
.card .go:hover{background:var(--ink)}
.card .ix{position:absolute;right:14px;top:14px;font:300 13px/1 "Jost",sans-serif;color:#fff;text-shadow:0 1px 8px rgba(0,0,0,.4);letter-spacing:.1em}

/* navegación inferior */
.nav{position:fixed;z-index:26;left:0;right:0;bottom:0;display:flex;align-items:center;gap:18px;padding:16px 32px calc(16px + env(safe-area-inset-bottom));
  background:linear-gradient(0deg,rgba(246,243,238,.98),rgba(246,243,238,.9));border-top:1px solid var(--line)}
.zones{display:flex;gap:6px;flex:1;overflow-x:auto;scrollbar-width:none}
.zones::-webkit-scrollbar{display:none}
.zones button{flex:none;border:1px solid var(--line);background:transparent;color:var(--ink);padding:10px 16px;border-radius:999px;font:500 11px/1 "DM Sans",sans-serif;letter-spacing:.16em;text-transform:uppercase;cursor:pointer;transition:background .3s,color .3s}
.zones button[aria-pressed="true"]{background:var(--brand);color:#fff;border-color:var(--brand)}
.zones button.soon{opacity:.45;cursor:default}
.prog{font:300 13px/1 "Jost",sans-serif;letter-spacing:.14em;white-space:nowrap;opacity:.75}
.arw{display:flex;gap:8px}
.arw button{width:44px;height:44px;border-radius:50%;border:1px solid var(--line);background:#fff;color:var(--brand);cursor:pointer;display:grid;place-items:center}
.arw button:disabled{opacity:.35;cursor:default}
.arw svg{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:1.4}
.free{font-size:11px;letter-spacing:.16em;text-transform:uppercase;background:none;border:0;color:var(--ink);opacity:.65;cursor:pointer;white-space:nowrap}

/* modo embebido (portada de la web) */
body.embed .top,body.embed .nav,body.embed .rail,body.embed .card,body.embed .intro,body.embed .leg,body.embed .clouds{display:none!important}
body.embed .lm{opacity:0}
body.embed .mk .bub{width:26px;height:26px}
/* nubes: paso entre zonas lejanas */
.clouds{position:fixed;inset:0;z-index:21;pointer-events:none;opacity:0;overflow:hidden;contain:strict;transition:opacity .75s ease-in}
.clouds::before{content:"";position:absolute;inset:0;z-index:2;background:radial-gradient(70% 60% at 50% 45%,rgba(255,255,255,.94),rgba(240,243,246,.9));opacity:0;transition:opacity .6s ease-in .25s}
.clouds i{position:absolute;inset:-22%;background-size:cover;transform:scale(1.5) translate3d(0,0,0);transition:transform 2.4s cubic-bezier(.2,.7,.2,1);will-change:transform}
.clouds i:nth-child(1){z-index:3;opacity:.8;background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='900' height='900'><filter id='c' x='0' y='0' width='100%' height='100%'><feTurbulence type='fractalNoise' baseFrequency='.0045' numOctaves='5' seed='3'/><feColorMatrix values='0 0 0 0 .87  0 0 0 0 .9  0 0 0 0 .93  1.9 0 0 0 -.62'/></filter><rect width='100%' height='100%' filter='url(%23c)'/></svg>")}
.clouds i:nth-child(2){background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='900' height='900'><filter id='c' x='0' y='0' width='100%' height='100%'><feTurbulence type='fractalNoise' baseFrequency='.0045' numOctaves='5' seed='11'/><feColorMatrix values='0 0 0 0 .87  0 0 0 0 .9  0 0 0 0 .93  1.9 0 0 0 -.62'/></filter><rect width='100%' height='100%' filter='url(%23c)'/></svg>");z-index:3;opacity:.9}
.clouds i:nth-child(3){background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='900' height='900'><filter id='c' x='0' y='0' width='100%' height='100%'><feTurbulence type='fractalNoise' baseFrequency='.0045' numOctaves='5' seed='27'/><feColorMatrix values='0 0 0 0 .87  0 0 0 0 .9  0 0 0 0 .93  1.9 0 0 0 -.62'/></filter><rect width='100%' height='100%' filter='url(%23c)'/></svg>");z-index:3;opacity:.75}
.clouds.in{opacity:1}.clouds.in::before{opacity:1}
.clouds.in i:nth-child(1){transform:scale(1) translate3d(-3%,2%,0)}.clouds.in i:nth-child(2){transform:scale(1.1) translate3d(4%,-2%,0)}.clouds.in i:nth-child(3){transform:scale(1.05) translate3d(-2%,-4%,0)}
.clouds.out{opacity:0;transition:opacity 1.3s ease-out .15s}.clouds.out::before{opacity:0;transition:opacity .7s ease-out}
.clouds.out i:nth-child(1){transform:scale(1.9) translate3d(-10%,6%,0)}.clouds.out i:nth-child(2){transform:scale(2.2) translate3d(12%,-8%,0)}.clouds.out i:nth-child(3){transform:scale(2) translate3d(-6%,-12%,0)}

/* itinerario: la línea que une las promociones */
.rail{position:fixed;z-index:24;right:30px;top:50%;transform:translateY(-50%);display:grid;gap:0;font:500 9.5px/1 "DM Sans",sans-serif;letter-spacing:.2em;text-transform:uppercase;color:var(--ink);transition:opacity .8s}
.rail .z{display:flex;justify-content:flex-end;align-items:center;gap:10px;padding:12px 0 6px;opacity:.55;white-space:nowrap}
.rail .z:first-child{padding-top:0}
.rail .s{position:relative;display:flex;justify-content:flex-end;align-items:center;gap:12px;height:22px;cursor:pointer;background:none;border:0;padding:0;color:inherit;font:inherit;letter-spacing:inherit;text-transform:inherit}
.rail .s::after{content:"";position:absolute;right:4px;top:-11px;bottom:-11px;width:1px;background:var(--line);z-index:-1}
.rail .s b{width:9px;height:9px;border-radius:50%;background:var(--paper);border:1px solid rgba(2,58,69,.4);transition:transform .4s var(--ease),background .4s,border-color .4s;flex:none}
.rail .s span{opacity:0;transform:translateX(6px);transition:opacity .35s,transform .45s var(--ease);white-space:nowrap;text-shadow:0 0 8px var(--paper),0 0 3px var(--paper)}
.rail .s:hover span{opacity:.75;transform:none}
.rail .s.seen b{background:rgba(1,94,112,.35);border-color:transparent}
.rail .s.on b{background:var(--brand);border-color:var(--brand);transform:scale(1.45);box-shadow:0 0 0 4px rgba(1,94,112,.14)}
.rail .s.on span{opacity:1;transform:none;color:var(--brand);font-weight:600}
body.intro-on .rail,body.free .rail{opacity:0;pointer-events:none}
.card .nx{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:2px 0 0;padding:11px 0 0;border:0;border-top:1px solid var(--line);background:none;color:var(--ink);cursor:pointer;text-align:left;font:400 12.5px/1.3 "DM Sans",sans-serif}
.card .nx[hidden]{display:none}
.card .nx small{display:block;font-size:9.5px;letter-spacing:.2em;text-transform:uppercase;opacity:.55;margin-bottom:3px}
.card .nx i{font-style:normal;font-size:16px;color:var(--brand);transition:transform .4s var(--ease)}
.card .nx:hover i{transform:translateX(4px)}
@media (max-width:1100px){.rail{display:none}}

/* título de tramo durante el vuelo */
.leg{position:fixed;z-index:22;left:50%;top:18%;transform:translate(-50%,10px);text-align:center;pointer-events:none;opacity:0;transition:opacity .6s,transform .9s var(--ease)}
.leg.on{opacity:1;transform:translate(-50%,0)}
.leg b{display:block;font:200 clamp(40px,6vw,84px)/1 "Jost",sans-serif;letter-spacing:-.02em;color:var(--brand);text-shadow:0 0 30px var(--paper)}
.leg span{font-size:11px;letter-spacing:.3em;text-transform:uppercase;opacity:.7}

.err{position:fixed;inset:0;z-index:19;display:none;overflow:auto;padding:110px 32px 60px;background:var(--paper)}
.err.on{display:block}
.err .eh{max-width:1180px;margin:0 auto 34px;display:grid;gap:12px}
.err .eh small{font-size:11px;letter-spacing:.3em;text-transform:uppercase;opacity:.6}
.err .eh h2{margin:0;font:200 clamp(40px,6vw,76px)/1 "Jost",sans-serif;letter-spacing:-.02em;color:var(--brand)}
.err .eh p{margin:0;max-width:620px;line-height:1.6;opacity:.8}
.err .zg{max-width:1180px;margin:0 auto 34px}
.err .zg h3{margin:0 0 14px;font:500 11px/1 "DM Sans",sans-serif;letter-spacing:.26em;text-transform:uppercase;opacity:.65}
.err .gr{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:18px}
.err a.pc{display:grid;background:#fff;color:var(--ink);text-decoration:none;box-shadow:0 18px 40px -28px rgba(1,38,46,.5);transition:transform .5s var(--ease)}
.err a.pc:hover{transform:translateY(-4px)}
.err a.pc img{width:100%;aspect-ratio:16/10;object-fit:cover;display:block}
.err a.pc span{padding:14px 16px 16px;display:grid;gap:6px}
.err a.pc b{font:300 22px/1.1 "Jost",sans-serif;color:var(--brand)}
.err a.pc em{font-style:normal;font-size:12.5px;opacity:.75}
body.nomap .nav,body.nomap .rail,body.nomap .intro,body.nomap .card{display:none!important}
@media (max-width:720px){.err{padding:84px 16px 40px}}

@media (max-width:720px){
  .top{padding:16px 18px}
  .top .back{font-size:10px;letter-spacing:.14em}
  .card{left:10px;right:10px;width:auto;bottom:calc(118px + env(safe-area-inset-bottom));max-height:calc(100dvh - 190px);overflow:auto;border-radius:14px;overscroll-behavior:contain}
  .card::before{content:"";position:absolute;z-index:5;top:8px;left:50%;width:38px;height:4px;margin-left:-19px;border-radius:2px;background:rgba(255,255,255,.9);box-shadow:0 1px 4px rgba(0,0,0,.2)}
  .card .ph{aspect-ratio:16/7}
  .card .bd{padding:14px 16px 16px;gap:7px}
  .card h3{font-size:24px}
  .card .zn{font-size:9.5px}
  .card .mt,.card .nr{display:none}
  .card.open .mt,.card.open .nr{display:flex}
  .card.open .mt{display:block}
  .card.open .ph{aspect-ratio:16/10}
  .card .go{min-height:42px}
  .nav{flex-wrap:wrap;gap:10px 12px;padding:10px 12px calc(10px + env(safe-area-inset-bottom))}
  .arw button{width:40px;height:40px}
  .free{margin-left:auto;font-size:10px;letter-spacing:.12em;padding:8px 0}
  .zones{order:3;flex-basis:100%}
  .zones button{padding:9px 13px;font-size:10px}
  .mk .lb{font-size:9px;letter-spacing:.14em}
  .mk.on .bub{width:58px;height:58px}
  .leg{top:14%}
  body.free .card{bottom:calc(118px + env(safe-area-inset-bottom))}
}

/* nivel de detalle según zoom */
body[data-lod="far"] .lm,body[data-lod="far"] .mk .lb{opacity:0}
body[data-lod="far"] .mk .stem{height:10px}
body[data-lod="mid"] .lm{opacity:.0}
body[data-lod="near"] .zl{opacity:0}
.mk.away{opacity:0!important;pointer-events:none}
.lm,.zl,.mk .lb{transition:opacity .5s}
.mk .stem{height:54px}
.mk.on .lb{color:var(--brand);font-weight:600}
body.free .mk{cursor:pointer}
@media (min-width:721px){body.free .card{bottom:96px}}
</style>
</head>
<body class="intro-on">
<div id="map" aria-label="Mapa de promociones de Shevat"></div>

<header class="top"><a class="wm" href="index.html">SHEVAT</a><a class="back" href="promociones.html">Todas las promociones →</a></header>

<div class="intro" id="intro"><div class="in"><p>Shevat · Dónde construimos</p><h1>Ubicaciones</h1><div class="sub" id="iSub">Barcelona y Sant Cugat</div></div><div class="scroll"><i><svg viewBox="0 0 16 16"><path d="M8 2.5v11M3.8 9.3 8 13.5l4.2-4.2"/></svg></i><span>Haz scroll <b>para empezar</b></span></div></div>
<div class="clouds" id="clouds"><i></i><i></i></div>
<aside class="rail" id="rail" aria-label="Itinerario"></aside>
<div class="leg" id="leg"><span id="legK"></span><b id="legT"></b></div>

<article class="card" id="card" aria-live="polite">
  <div class="ph" id="cPh"><div id="cImgs"></div><button class="nv l" id="cPrev" aria-label="Foto anterior"></button><button class="nv r" id="cNext" aria-label="Foto siguiente"></button><div class="dots" id="cDots"></div><span class="st" id="cSt" hidden></span><span class="ix" id="cIx"></span></div>
  <div class="bd"><span class="zn" id="cZn"></span><h3 id="cName"></h3><p class="mt" id="cMeta"></p><div class="nr" id="cNear"></div>
  <a class="go" id="cGo" href="#">Ver promoción →</a><button class="nx" id="cNx"></button></div>
</article>

<nav class="nav" aria-label="Recorrido">
  <div class="arw"><button id="prev" aria-label="Anterior"><svg viewBox="0 0 16 16"><path d="M10 3 5 8l5 5"/></svg></button><button id="next" aria-label="Siguiente"><svg viewBox="0 0 16 16"><path d="m6 3 5 5-5 5"/></svg></button></div>
  <span class="prog" id="prog">00 / 07</span>
  <div class="zones" id="zones"></div>

$('card').addEventListener('touchend',e=>{ if(cx==null) return; const dx=e.changedTouches[0].clientX-cx, dy=e.changedTouches[0].clientY-cy; cx=cy=null;
  if(Math.abs(dx)>60&&Math.abs(dx)>Math.abs(dy)*1.3&&!e.target.closest('.ph')){ go(cur+(dx<0?1:-1)); return; }
  if(dy<-40) $('card').classList.add('open'); else if(dy>40){ if($('card').classList.contains('open')) $('card').classList.remove('open'); else $('card').classList.remove('on'); } },{passive:true});
$('card').querySelector('.bd').addEventListener('click',e=>{ if(MOB&&!e.target.closest('a')) $('card').classList.toggle('open'); });
$('card').addEventListener('mouseenter',()=>{ clearTimeout(sl.t); const o=$('cDots').querySelector('.on b'); if(o) o.style.animationPlayState='paused'; });
$('card').addEventListener('mouseleave',()=>{ const o=$('cDots').querySelector('.on b'); if(o) o.style.animationPlayState='running'; if(sl.list.length>1) sl.t=setTimeout(()=>show(sl.k+1),DUR*.5); });

/* =========================================================================
   Recorrido
   ========================================================================= */
let cur=-1, busy=false, freeMode=false, flightId=0;
function legTitle(k,t){ $('legK').textContent=k; $('legT').textContent=t; $('leg').classList.add('on'); clearTimeout(legTitle.t); legTitle.t=setTimeout(()=>$('leg').classList.remove('on'),2400); }
function camFor(p){ const c=Object.assign({center:p.ll,offset:freeMode&&!MOB?[0,60]:(MOB?[0,-Math.round(innerHeight*.2)]:[200,50])},p.cam); if(MOB&&c.zoom) c.zoom-=.45; return c; }
function go(i){
  if(i<0||i>=P.length) return;
  const prev=cur, p=P[i], id=++flightId; cur=i; busy=true; stopOrbit();
  $('intro').classList.add('gone'); document.body.classList.remove('intro-on'); $('card').classList.remove('on','open'); clearTimeout(sl.t);
  MK.forEach((m,j)=>m.getElement().classList.toggle('on',j===i)); plantJob++;
  const far=prev<0||P[prev].zone!==p.zone;
  if(far) legTitle(prev<0?'Primera parada':'Siguiente zona',p.zone);
  const arrive=()=>{ if(id!==flightId) return; const c=camFor(p); if(Math.abs(map.getZoom()-(c.zoom||17.7))>.2) map.easeTo(Object.assign(c,{duration:700})); busy=false; lock=Date.now()+1000; settleOthers(i); rise(i); setTimeout(()=>{ if(id===flightId) plant(i); },P[i].floors*170+250); fill(i); $('card').classList.add('on'); if(!freeMode) startOrbit(); };
  if(far&&prev>=0&&dist(P[prev].ll,p.ll)>5000){ // zona lejana: sube a las nubes y aparece en el destino
    const c=$('clouds'), cam=camFor(p);
    c.classList.remove('out'); void c.offsetWidth; c.classList.add('in');
    map.easeTo({zoom:map.getZoom()-1.1,pitch:Math.min(72,map.getPitch()+10),bearing:map.getBearing()-12,duration:800,easing:t=>t*t,essential:true});
    setTimeout(()=>{ if(id!==flightId) return;
      map.jumpTo({center:p.ll,zoom:(cam.zoom||17.5)-1.5,pitch:70,bearing:(cam.bearing||0)-35});
      let done=false; const reveal=()=>{ if(done||id!==flightId) return; done=true; c.classList.remove('in'); c.classList.add('out');
        map.easeTo(Object.assign(camFor(p),{duration:1700,easing:t=>1-Math.pow(1-t,3),essential:true})); map.once('moveend',arrive); };
      map.once('idle',reveal); setTimeout(reveal,900); },820);
  } else if(far&&prev>=0){
    map.flyTo(Object.assign(camFor(p),{duration:3000,essential:true,curve:1.3})); map.once('moveend',arrive);
  } else {
    map.flyTo(Object.assign(camFor(p),{duration:prev<0?4600:3000,essential:true,curve:1.4}));
    map.once('moveend',arrive);
  }
  $('prog').textContent=pad(i+1)+' / '+pad(P.length); railTo(i);
  $('prev').disabled=i===0; $('next').disabled=i===P.length-1;
  [...$('zones').children].forEach(b=>b.setAttribute('aria-pressed',b.dataset.z===p.zone));
}
let orbitRAF=0;
function stopOrbit(){ cancelAnimationFrame(orbitRAF); orbitRAF=0; }
function startOrbit(){ stopOrbit(); let last=performance.now();
  (function f(t){ if(busy||freeMode||document.hidden) return; const dt=Math.min(34,t-last); last=t; map.setBearing(map.getBearing()+dt/1000*1.6); orbitRAF=requestAnimationFrame(f); })(last); }
document.addEventListener('visibilitychange',()=>{ if(!document.hidden&&cur>=0&&!busy&&!freeMode) startOrbit(); });
['mousedown','touchstart','wheel'].forEach(ev=>map.getCanvasContainer().addEventListener(ev,stopOrbit,{passive:true}));

/* zonas y flechas */
ZONES.forEach(([z,i])=>{ const b=document.createElement('button'); b.textContent=z; b.dataset.z=z; b.setAttribute('aria-pressed','false');
  if(i<0){ b.classList.add('soon'); b.title='Próximamente'; } else b.addEventListener('click',()=>{ if(freeMode) fitZone(z); else go(i); }); $('zones').appendChild(b); });
$('prev').onclick=()=>{ if(freeMode) toggleFree(false); go(cur-1); }; $('next').onclick=()=>{ if(freeMode) toggleFree(false); go(cur+1); };

/* exploración libre: el mapa se suelta, las promociones siguen localizables */
let REGNOW='cat';
function lockRegion(r){ REGNOW=r; map.setMaxBounds(REG[r].b); map.setMinZoom(REG[r].z); map.setMaxPitch(70); }
function freeRelease(){ map.setMaxBounds(null); map.setMinZoom(0); map.setMaxPitch(80); }
function toggleFree(on){ freeMode=on; document.body.classList.toggle('free',on); $('free').textContent=on?(MOB?'Recorrido':'Volver al recorrido'):(MOB?'Explorar':'Explorar libremente');
  if(on){ stopOrbit(); map.scrollZoom.enable(); map.dragRotate.enable(); map.touchZoomRotate.enableRotation(); $('card').classList.remove('on');
    const r=regOf(cur>=0?P[cur].zone:'Barcelona'), b=new maplibregl.LngLatBounds(); P.filter(p=>regOf(p.zone)===r).forEach(p=>b.extend(p.ll));
    freeRelease(); map.fitBounds(b,{padding:MOB?{top:90,bottom:200,left:40,right:40}:{top:120,bottom:140,left:80,right:80},maxZoom:15.4,pitch:45,bearing:-15,duration:2400,essential:true});
    map.once('moveend',()=>{ if(freeMode) lockRegion(r); }); }
  else { freeRelease(); map.scrollZoom.disable(); map.touchZoomRotate.disableRotation(); } }
function fitZone(z){ const b=new maplibregl.LngLatBounds(); P.filter(p=>p.zone===z).forEach(p=>b.extend(p.ll)); const r=regOf(z);
  if(r!==REGNOW) freeRelease();
  map.fitBounds(b,{padding:MOB?{top:100,bottom:220,left:50,right:50}:{top:160,bottom:180,left:140,right:140},maxZoom:15.6,pitch:55,bearing:-15,duration:r!==REGNOW?3600:2200,essential:true});
  map.once('moveend',()=>{ if(freeMode) lockRegion(r); });
  [...$('zones').children].forEach(x=>x.setAttribute('aria-pressed',x.dataset.z===z)); }
$('free').onclick=()=>{ if(freeMode){ toggleFree(false); go(Math.max(cur,0)); } else toggleFree(true); };
map.on('click',()=>{ if(freeMode) $('card').classList.remove('on'); else if(cur<0) step(1); });

/* scroll / swipe / teclado = siguiente parada */
let lock=0;
function step(d){ const now=Date.now(); if(freeMode||busy||now<lock) return; lock=now+1200; go(cur<0?0:cur+d); }
let lastW=0, gap=true;
addEventListener('wheel',e=>{ if(freeMode) return; e.preventDefault(); const now=Date.now(), quiet=now-lastW>450; lastW=now; if(quiet) gap=true; if(!gap||Math.abs(e.deltaY)<8) return; gap=false; step(e.deltaY>0?1:-1); },{passive:false});
let ty=null; addEventListener('touchstart',e=>{ ty=e.touches[0].clientY; },{passive:true});
addEventListener('touchend',e=>{ if(ty==null||freeMode) return; const d=ty-e.changedTouches[0].clientY; if(Math.abs(d)>50&&!e.target.closest('.zones,.card')) step(d>0?1:-1); ty=null; },{passive:true});
addEventListener('keydown',e=>{ if(freeMode) return; if(['ArrowDown','ArrowRight','PageDown',' '].includes(e.key)){ e.preventDefault(); step(1);} if(['ArrowUp','ArrowLeft','PageUp'].includes(e.key)){ e.preventDefault(); step(-1);} });

/* entrada */
buildRail();
/* las texturas SVG (nubes y grano) se convierten a imagen una vez: animarlas cuesta casi nada */
function bake(el,size){ const v=getComputedStyle(el).backgroundImage; if(!v.startsWith('url("data:image/svg')) return; const src=v.slice(5,-2).replace(/\\"/g,'"');
  const im=new Image(); im.onload=()=>{ const c=document.createElement('canvas'); c.width=c.height=size; c.getContext('2d').drawImage(im,0,0,size,size); try{ c.toBlob(b=>{ if(b) el.style.backgroundImage=`url(${URL.createObjectURL(b)})`; }); }catch(e){} };
  im.src=src; }
idle(()=>{ document.querySelectorAll('.clouds i').forEach(el=>bake(el,768)); });
$('iSub').textContent=P.length+' promociones · Barcelona, Sant Cugat, Costa Brava y Madrid';
if(MOB){ $('free').textContent='Explorar'; document.querySelector('.intro .scroll span').innerHTML='Desliza o toca <b>para empezar</b>'; }
/* mientras está la portada, la vista aérea se desliza muy despacio */
map.on('load',()=>{ if(EMBED) return; if(cur<0&&!location.hash) map.easeTo({center:[2.098,41.447],zoom:map.getZoom()+.3,bearing:-8,duration:60000,easing:t=>t,essential:true}); });
if(EMBED){ document.body.classList.remove('intro-on');
  let run=true, raf=0; const spin=()=>{ cancelAnimationFrame(raf); let last=performance.now(); (function f(t){ if(!run) return; const dt=Math.min(34,t-last); last=t; map.setBearing(map.getBearing()+dt/1000*2.2); raf=requestAnimationFrame(f); })(last); };
  map.once('load',()=>{ const b=new maplibregl.LngLatBounds(); P.filter(p=>regOf(p.zone)==='cat'&&p.zone!=='Gavà Mar').forEach(p=>b.extend(p.ll));
    map.fitBounds(b,{padding:60,pitch:56,bearing:-20,duration:0}); map.setZoom(map.getZoom()+.25); spin(); });
  addEventListener('message',e=>{ if(e.data==='pause'){ run=false; cancelAnimationFrame(raf); } if(e.data==='play'&&!run){ run=true; spin(); } }); }
if(location.hash&&!EMBED){ const i=P.findIndex(p=>p.id===location.hash.slice(1)); if(i>=0){ document.body.classList.remove('intro-on'); $('intro').classList.add('gone'); map.once('load',()=>setTimeout(()=>go(i),300)); } }
})();
</script>
